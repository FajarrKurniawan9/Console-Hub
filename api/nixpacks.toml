[phases.setup]
nixPkgs = ["php84", "php84Packages.composer", "nodejs"]

[phases.build]
cmds = ["composer install --optimize-autoloader --no-scripts --no-interaction"]

[start]
cmd = "sh -c 'w=\"\"; q=\"\"; s=\"\"; cleanup() { trap - INT TERM EXIT; kill $w $q $s 2>/dev/null || true; wait $w $q $s 2>/dev/null || true; }; trap cleanup INT TERM EXIT; loop() { d=$1; shift; c=\"\"; on_term() { [ -n \"$c\" ] && kill $c 2>/dev/null || true; exit 0; }; trap on_term INT TERM; while true; do \"$@\" & c=$!; wait $c || true; sleep $d & c=$!; wait $c || true; done; }; loop 2 php artisan queue:work --queue=exports,default --sleep=3 --tries=1 --timeout=120 --max-time=3600 --no-interaction & q=$!; loop 5 php artisan schedule:work --no-interaction & s=$!; php artisan serve --host=0.0.0.0 --port=${PORT:-8000} & w=$!; wait $w'"