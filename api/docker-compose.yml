services:
  postgres:
    image: postgres:16
    environment:
      POSTGRES_DB: consolehub
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    command: >
      bash -c "docker-entrypoint.sh postgres &
               until pg_isready -U postgres; do sleep 1; done;
               psql -U postgres -tc \"SELECT 1 FROM pg_database WHERE datname = 'consolehub_test'\" | grep -q 1 ||
               psql -U postgres -c 'CREATE DATABASE consolehub_test';
               wait"

volumes:
  pgdata:
